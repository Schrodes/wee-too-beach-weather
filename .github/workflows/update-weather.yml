name: Update public weather data
on:
  workflow_dispatch:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
permissions:
  contents: write
concurrency:
  group: weather-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve sanitized public readings
        env:
          THINGSPEAK_READ_API_KEY: ${{ secrets.THINGSPEAK_READ_API_KEY }}
        run: python publish_weather.py
      - name: Commit public JSON only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json data/today.json data/history_1.json data/history_7.json data/history_30.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public weather data"
            git push
          fi
